<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-MapBook | 智能地理故事可视化</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts - 复古科技风格 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ===== 复古科技风格 ===== */
        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --accent: #ff00ff;
            --dark: #0a0a0f;
            --darker: #050508;
            --panel: rgba(10, 20, 30, 0.85);
            --border: rgba(0, 255, 136, 0.3);
            --glow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--darker);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(0,255,136,0.03) 50%, transparent 51%),
                linear-gradient(transparent 49%, rgba(0,255,136,0.03) 50%, transparent 51%);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(180deg, var(--dark) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: relative;
            z-index: 100;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: var(--glow);
            letter-spacing: 3px;
        }
        
        .logo span {
            color: var(--secondary);
        }
        
        /* 主布局 */
        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 70px);
            position: relative;
            z-index: 1;
        }
        
        /* 侧边栏 */
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .panel {
            background: rgba(0, 20, 30, 0.5);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--secondary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* 表单控件 */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--primary);
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--glow);
        }
        
        .form-select option {
            background: var(--dark);
        }
        
        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }
        
        .btn:hover {
            background: var(--primary);
            color: var(--dark);
            box-shadow: var(--glow);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            border-color: var(--secondary);
            color: var(--secondary);
        }
        
        .btn-secondary:hover {
            background: var(--secondary);
        }
        
        /* 文件上传 */
        .file-upload {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .file-upload:hover {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.05);
        }
        
        .file-upload input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .file-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        
        .file-name {
            font-size: 0.85rem;
            color: var(--secondary);
            word-break: break-all;
        }
        
        /* 地图区域 */
        .map-container {
            position: relative;
            height: 100%;
            background: var(--dark);
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        /* 事件列表 */
        .event-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .event-item {
            background: rgba(0, 20, 30, 0.5);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .event-item:hover {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .event-title {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }
        
        .event-address {
            font-size: 0.75rem;
            color: #888;
        }
        
        /* 状态显示 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            background: var(--dark);
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 聊天区域 */
        .chat-container {
            display: none;
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 350px;
            height: 450px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            z-index: 1000;
            flex-direction: column;
        }
        
        .chat-container.active {
            display: flex;
        }
        
        .chat-header {
            padding: 0.8rem;
            border-bottom: 1px solid var(--border);
            font-family: 'Orbitron', sans-serif;
            color: var(--secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
        }
        
        .chat-input-area {
            padding: 0.8rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }
        
        .chat-input {
            flex: 1;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            color: var(--primary);
            font-family: inherit;
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dark);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        /* Leaflet 自定义样式 */
        .leaflet-popup-content-wrapper {
            background: var(--panel);
            border: 1px solid var(--border);
            color: #e0e0e0;
            font-family: 'Share Tech Mono', monospace;
        }
        
        .leaflet-popup-tip {
            background: var(--panel);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">AI-MAP<span>BOOK</span></div>
    </header>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <!-- 文件上传 -->
            <div class="panel">
                <div class="panel-title">📁 文件上传</div>
                <div class="file-upload" id="fileUpload">
                    <input type="file" id="fileInput" accept=".pdf,.txt">
                    <div class="file-icon">📄</div>
                    <div class="file-name" id="fileName">点击或拖拽上传文件</div>
                </div>
            </div>
            
            <!-- 设置 -->
            <div class="panel">
                <div class="panel-title">⚙️ 参数设置</div>
                
                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="password" class="form-input" id="apiKey" placeholder="输入 DeepSeek API Key">
                </div>
                
                <div class="form-group">
                    <label class="form-label">地理编码</label>
                    <select class="form-select" id="geocodeType">
                        <option value="free">免费 (Nominatim)</option>
                        <option value="baidu">百度地图 API</option>
                    </select>
                </div>
                
                <div class="form-group" id="baiduKeyGroup" style="display: none;">
                    <label class="form-label">百度 Key</label>
                    <input type="text" class="form-input" id="baiduKey" placeholder="百度地图 API Key">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" id="useRag"> 启用 RAG 增强
                    </label>
                </div>
                
                <button class="btn" id="processBtn">开始处理</button>
            </div>
            
            <!-- 事件列表 -->
            <div class="panel">
                <div class="panel-title">📍 事件列表 <span id="eventCount">(0)</span></div>
                <div class="event-list" id="eventList">
                    <div style="color: #666; text-align: center; padding: 1rem;">
                        暂无事件数据
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 地图 -->
        <main class="map-container">
            <div id="map"></div>
            
            <!-- 加载中 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>处理中...</div>
            </div>
        </main>
    </div>
    
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot"></span>
            <span>系统就绪</span>
        </div>
        <div class="status-item">
            <span id="statusText">等待文件上传...</span>
        </div>
    </div>
    
    <!-- 聊天机器人 -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <span>🤖 MapAgent</span>
            <span style="cursor: pointer;" onclick="toggleChat()">✕</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="输入消息...">
            <button class="btn btn-secondary" style="width: auto;" onclick="sendMessage()">发送</button>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ===== 初始化 =====
        let map;
        let markers = [];
        let geoData = [];
        
        // 初始化地图
        function initMap() {
            map = L.map('map').setView([35.8617, 104.1954], 4);
            
            // 底图
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        
        // 文件上传
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
            }
        });
        
        // 地理编码类型切换
        document.getElementById('geocodeType').addEventListener('change', function(e) {
            const baiduGroup = document.getElementById('baiduKeyGroup');
            baiduGroup.style.display = e.target.value === 'baidu' ? 'block' : 'none';
        });
        
        // 处理文件
        document.getElementById('processBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请先选择文件');
                return;
            }
            
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert('请输入 API Key');
                return;
            }
            
            // 显示加载
            document.getElementById('loading').classList.add('active');
            document.getElementById('statusText').textContent = '上传文件中...';
            
            try {
                // 1. 上传文件
                const formData = new FormData();
                formData.append('file', file);
                
                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const uploadData = await uploadRes.json();
                
                if (!uploadData.success) {
                    throw new Error(uploadData.error);
                }
                
                document.getElementById('statusText').textContent = '处理中...';
                
                // 2. 处理文件
                const processRes = await fetch('/api/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        filename: uploadData.filename,
                        api_key: apiKey,
                        geocode_type: document.getElementById('geocodeType').value,
                        baidu_key: document.getElementById('baiduKey').value,
                        use_rag: document.getElementById('useRag').checked
                    })
                });
                
                const processData = await processRes.json();
                
                if (!processData.success) {
                    throw new Error(processData.error);
                }
                
                // 显示数据
                geoData = processData.data;
                displayEvents(geoData);
                
                document.getElementById('statusText').textContent = 
                    `处理完成，共 ${geoData.length} 个事件`;
                
            } catch (error) {
                alert('处理失败: ' + error.message);
                document.getElementById('statusText').textContent = '处理失败';
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        });
        
        // 显示事件
        function displayEvents(data) {
            // 清除标记
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            // 更新列表
            const listEl = document.getElementById('eventList');
            document.getElementById('eventCount').textContent = `(${data.length})`;
            
            if (data.length === 0) {
                listEl.innerHTML = '<div style="color: #666; text-align: center; padding: 1rem;">暂无事件数据</div>';
                return;
            }
            
            let html = '';
            data.forEach((item, index) => {
                if (item.geocode) {
                    const lat = item.geocode.latitude;
                    const lng = item.geocode.longitude;
                    
                    // 添加标记
                    const marker = L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup(`
                            <strong>${item.event_title}</strong><br>
                            <small>${item.event_type}</small><br>
                            <small>📍 ${item.address}</small>
                        `);
                    markers.push(marker);
                    
                    // 列表项
                    html += `
                        <div class="event-item" onclick="focusEvent(${index})">
                            <div class="event-title">${item.event_title}</div>
                            <div class="event-address">📍 ${item.address}</div>
                        </div>
                    `;
                }
            });
            
            listEl.innerHTML = html;
            
            // 调整视图
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }
        
        // 聚焦事件
        function focusEvent(index) {
            const item = geoData[index];
            if (item.geocode) {
                map.setView([item.geocode.latitude, item.geocode.longitude], 10);
                markers[index].openPopup();
            }
        }
        
        // 聊天功能
        function toggleChat() {
            document.getElementById('chatContainer').classList.toggle('active');
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.innerHTML += `<div style="margin-bottom: 0.5rem;">👤 ${message}</div>`;
            input.value = '';
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                
                const data = await res.json();
                messagesEl.innerHTML += `<div style="margin-bottom: 0.5rem; color: var(--primary);">🤖 ${data.response}</div>`;
            } catch (error) {
                messagesEl.innerHTML += `<div style="color: #ff4444;">错误: ${error.message}</div>`;
            }
            
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        // 初始化
        initMap();
    </script>
</body>
</html>
